<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01</title>
</head>
<body>
    <script>
        // Primeira Declaração de variáveis
        let n1 = 15
        let n2 = 25
        let result
        document.write("Soma: " + n1 + " + " + n2 + " = " + (n1 + n2) + "<br>")
        console.log("Soma: " + n1 + " + " + n2 + " = " + (n1 + n2) + "<br>")
        
        n1 = 80
        n2 = 35
        document.write("Subtração: " + n1 + " - " + n2 + " = " + (n1 - n2) + "<br>")
        console.log("Subtração: " + n1 + " - " + n2 + " = " + (n1 - n2) + "<br>")

        n1 = 12
        n2 = 5
        document.write("Multiplicação: " + n1 + " x " + n2 + " = " + (n1 * n2) + "<br>")
        console.log("Multiplicação: " + n1 + " x " + n2 + " = " + (n1 * n2) + "<br>")

        n1 = 100
        n2 = 4
        result = n1 / n2
        document.write("Divisão: " + n1 + " / " + n2 + " = " + result + "<br>")
        console.log("Divisão: " + n1 + " / " + n2 + " = " + result + "<br>")

        n1 = 100
        n2 = 4
        result = n1 % n2
        document.write("Resto: " + n1 + " MOD " + n2 + " = " + result)
        console.log("Resto: " + n1 + " MOD " + n2 + " = " + result)
    </script>
</body>
</html>
