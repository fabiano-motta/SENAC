<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 04</title>
</head>
<body>
    <script>
        const produto = prompt("Digite o nome do produto:")
        let quantidade = parseInt(prompt("Digite a quantidade:"))
        let preco_unitario = parseFloat(prompt("Digte o preço unitário"))
        document.write(produto + " tem " + quantidade + " e cada um custa " + preco_unitario)
    </script>    
</body>
</html>
