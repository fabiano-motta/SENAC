<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aulas de Lógica de Programação</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .classList {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .classCard {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .classCard:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .classInfo h2 {
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 0.25rem;
        }

        .classInfo p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .classLink {
            display: inline-block;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.875rem;
            transition: background-color 0.2s ease;
            white-space: nowrap;
        }

        .classLink:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 600px) {
            .classCard {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .classLink {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Lógica de Programação</h1>
            <p>Acesse o material e os links das aulas abaixo</p>
        </header>

        <main class="classList">
            
            <article class="classCard">
                <div class="classInfo">
                    <h2>Aula 01</h2>
                </div>
                <a href="aula01/exercicio01.html" target="_blank" rel="noopener noreferrer" class="classLink">Acessar Aula</a>
            </article>

            <article class="classCard">
                <div class="classInfo">
                    <h2>Aula 02</h2>
                </div>
                <a href="aula02/exercicio01.html" target="_blank" rel="noopener noreferrer" class="classLink">Acessar Aula</a>
            </article>

            <article class="classCard">
                <div class="classInfo">
                    <h2>Aula 03</h2>
                </div>
                <a href="exercicio03.html" target="_blank" rel="noopener noreferrer" class="classLink">Acessar Aula</a>
            </article>

            <article class="classCard">
                <div class="classInfo">
                    <h2>Aula 04</h2>
                </div>
                <a href="exercicio04.html" target="_blank" rel="noopener noreferrer" class="classLink">Acessar Aula</a>
            </article>

            <article class="classCard">
                <div class="classInfo">
                    <h2>Aula 05</h2>
                </div>
                <a href="exercicio05.html" target="_blank" rel="noopener noreferrer" class="classLink">Acessar Aula</a>
            </article>

        </main>
    </div>

</body>
</html>
